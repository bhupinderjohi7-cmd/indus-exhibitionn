var x0=null;document.addEventListener("touchstart",function(e){x0=e.touches[0].clientX});document.addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(dx<-50&&i<L.length-1){i++;show()}if(dx>50&&i>0){i--;show()}x0=null});show();</script></body></html>
